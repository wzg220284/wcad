<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筛板布孔计算与可视化</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; display: flex; justify-content: center; color: #333; }
        .container { width: 1200px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; align-items: center; }
        h2 { margin-top: 0; color: #2c3e50; margin-bottom: 20px; }
        
        /* 顶部结果统计区布局 */
        .dashboard { width: 100%; display: flex; justify-content: space-around; flex-wrap: wrap; gap: 15px; background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e9ecef; box-sizing: border-box; }
        .stat-box { text-align: center; flex: 1 1 30%; min-width: 150px; }
        .stat-label { font-size: 14px; color: #6c757d; margin-bottom: 5px; font-weight: bold; }
        .stat-value { font-size: 26px; font-weight: bold; color: #0d6efd; }

        /* 左图右控布局 */
        .main-content { display: flex; width: 100%; gap: 30px; }
        .canvas-container { flex: 0 0 800px; height: 890px; border: 1px solid #e0e0e0; border-radius: 8px; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; position: relative; padding: 10px; box-sizing: border-box; }
        .controls { flex: 1; display: flex; flex-direction: column; gap: 8px; max-height: 890px; overflow-y: auto; padding-right: 5px; position: relative;}
        
        /* 控件样式 */
        .control-group { display: flex; flex-direction: column; gap: 3px; }
        .control-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 500; }
        .control-row { display: flex; align-items: center; gap: 10px; }
        input[type="range"] { flex: 1; cursor: pointer; }
        input[type="number"], input[type="password"], input[type="text"], select { width: 80px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-family: inherit;}
        select { width: 100%; text-align: left; }
        input:disabled { background-color: #e9ecef; cursor: not-allowed; }
        
        /* 序列号与计算按钮 */
        .calc-mode-box { background: #eef2f5; padding: 10px; border-radius: 6px; margin-bottom: 5px; border: 1px solid #dce3e9; }
        .calc-btn { width: 100%; padding: 12px; background: #198754; color: white; font-weight: bold; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; margin-top: auto; transition: background 0.2s; }
        .calc-btn:hover { background: #157347; }
        .license-status { font-size: 12px; font-weight: normal; color: #d9534f; background: #fdf0f0; padding: 2px 6px; border-radius: 4px; border: 1px solid #f5c6cb; }
        
        .controls::-webkit-scrollbar { width: 6px; }
        .controls::-webkit-scrollbar-thumb { background-color: #ccc; border-radius: 4px; }
        
        /* 图例 */
        .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; margin-top: 10px; justify-content: center; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-color { width: 12px; height: 12px; border-radius: 2px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="container">
    <h2>筛板布孔计算与可视化</h2>
    
    <!-- 顶部统计区 -->
    <div class="dashboard">
        <div class="stat-box">
            <div class="stat-label">塔截面积 (m²)</div>
            <div class="stat-value" id="resTotalArea">0.000 </div>
        </div>
        <div class="stat-box">
            <div class="stat-label">筛孔总数 (个)</div>
            <div class="stat-value" id="resHoleCount">0 </div>
        </div>
        <div class="stat-box">
            <div class="stat-label">开孔率</div>
            <div class="stat-value" id="resOpenRatio">0.00 %</div>
        </div>
    </div>

    <div class="main-content">
        <!-- 左侧矢量图区域 -->
        <div class="canvas-container">
            <svg id="traySvg" width="760" height="760" viewBox="0 0 760 760" xmlns="http://www.w3.org/2000/svg"></svg>
            <div class="legend">
                <div class="legend-item"><div class="legend-color" style="background:#a7f3d0;"></div>边缘盲区</div>
                <div class="legend-item"><div class="legend-color" style="background:#fed7d7;"></div>降液管</div>
                <div class="legend-item"><div class="legend-color" style="background:#feebc8;"></div>安定区</div>
                <div class="legend-item"><div class="legend-color" style="background:#cbd5e0;"></div>水平拼缝</div>
                <div class="legend-item"><div class="legend-color" style="background:#000000; border-radius:50%;"></div>有效筛孔</div>
            </div>
        </div>
        
        <!-- 右侧控制区 -->
        <div class="controls">
            <!-- 序列号模块 -->
            <div class="calc-mode-box">
                <div class="control-group" style="margin-bottom: 6px;">
                    <div class="control-header">
                        <span style="color: #333; font-weight: bold;">序列号</span>
                        <span class="license-status">
                            剩余: <span id="remains">-</span> 次 | <span id="expireDays">-天</span>
                        </span>
                    </div>
                    <div class="control-row" style="position: relative;">
                        <input type="password" id="licenseKey" placeholder="请输入序列号" style="flex: 1; text-align: left; padding-right: 28px;" value="TEST_KEY">
                        <svg id="toggleKeyBtn" viewBox="0 0 24 24" style="position: absolute; right: 8px; width: 18px; height: 18px; fill: #999; cursor: pointer;">
                            <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                        </svg>
                    </div>
                </div>
                <div class="control-group">
                    <div class="control-header"><span>计算触发模式</span></div>
                    <div class="control-row" style="font-size: 13px; margin-top: 3px;">
                        <label><input type="radio" name="calcTrigger" value="manual" checked> 手动模式</label>
                        <label><input type="radio" name="calcTrigger" value="auto"> 自动模式</label>
                    </div>
                </div>
            </div>

            <!-- 参数设置 -->
            <div class="control-group" style="margin-top: 5px;">
                <div class="control-header"><span>塔板选型</span></div>
                <div class="control-row">
                    <select id="trayType">
                        <option value="single" selected>单溢流 (无中间降液管)</option>
                        <option value="double">双溢流 (含中间降液管)</option>
                    </select>
                </div>
            </div>
            <div class="control-group">
                <div class="control-header"><span>网格方向</span></div>
                <div class="control-row">
                    <select id="gridDir">
                        <option value="rotated" selected>正三角形 (右转90度)</option>
                        <option value="normal">正三角形 (标准底边水平)</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <div class="control-header"><span>塔径 (mm)</span></div>
                <div class="control-row">
                    <input type="range" id="trayDiameter" min="200" max="10000" step="100" value="1800">
                    <input type="number" id="num_trayDiameter" step="100" value="1800">
                </div>
            </div>
            
            <div class="control-group" style="background: #fff8f8; padding: 6px 8px; border-radius: 6px; border: 1px solid #ffdfdf;">
                <div class="control-header"><span style="color: #d9534f; font-weight: bold;">侧降液管占比 (%)</span></div>
                <div class="control-row">
                    <input type="range" id="downcomerRatio" min="1.0" max="35.0" step="0.1" value="8.8">
                    <input type="number" id="num_downcomerRatio" step="0.1" value="8.8">
                </div>
                
                <!-- 中降液管占比设置（支持统一灰化逻辑） -->
                <div class="control-header" style="margin-top: 4px;"><span id="centerRatioLabel" style="color: #d9534f; font-weight: bold;">中降液管占比 (%)</span></div>
                <div class="control-row">
                    <input type="range" id="centerRatio" min="1.0" max="35.0" step="0.1" value="8.8" disabled>
                    <input type="number" id="num_centerRatio" step="0.1" value="8.8" disabled>
                </div>
            </div>

            <div class="control-group">
                <div class="control-header"><span>孔径 (mm)</span></div>
                <div class="control-row">
                    <input type="range" id="holeDiameter" min="1" max="20" step="0.5" value="8">
                    <input type="number" id="num_holeDiameter" step="0.5" value="8">
                </div>
            </div>

            <div class="control-group">
                <div class="control-header"><span>孔中心距 (mm)</span></div>
                <div class="control-row">
                    <input type="range" id="holePitch" min="2" max="50" step="1" value="15">
                    <input type="number" id="num_holePitch" step="1" value="15">
                </div>
            </div>

            <div class="control-group">
                <div class="control-header"><span>边缘无孔区宽度 (mm)</span></div>
                <div class="control-row">
                    <input type="range" id="edgeMargin" min="0" max="150" value="94">
                    <input type="number" id="num_edgeMargin" value="94">
                </div>
            </div>

            <div class="control-group">
                <div class="control-header"><span>水平拼缝带总宽 (mm)</span></div>
                <div class="control-row">
                    <input type="range" id="seamWidth" min="0" max="150" value="62">
                    <input type="number" id="num_seamWidth" value="62">
                </div>
            </div>

            <div class="control-group">
                <div class="control-header"><span>堰侧安定区宽度 (mm)</span></div>
                <div class="control-row">
                    <input type="range" id="calmZone" min="0" max="150" value="100">
                    <input type="number" id="num_calmZone" value="100">
                </div>
            </div>

            <div class="control-group">
                <div class="control-header"><span>塔板分块数</span></div>
                <div class="control-row">
                    <input type="range" id="numPanels" min="2" max="10" value="5">
                    <input type="number" id="num_numPanels" value="5">
                </div>
            </div>
            
            <!-- 开始计算按钮移到底部 -->
            <button class="calc-btn" id="btnCalculate">开始计算</button>
        </div>
    </div>
</div>

<script>
    let calcTriggerMode = 'manual';
    let renderTimer = null; 
    const apiUrl = "/api/shaiban";

    // 参数滑动条与数字框双向绑定
    const paramsMap = ['trayDiameter', 'downcomerRatio', 'centerRatio', 'holeDiameter', 'holePitch', 'edgeMargin', 'seamWidth', 'calmZone', 'numPanels'];
    
    paramsMap.forEach(param => {
        const slider = document.getElementById(param);
        const numInput = document.getElementById('num_' + param);
        
        if (slider) { 
            slider.addEventListener('input', (e) => { 
                if(numInput) numInput.value = e.target.value; 
                handleLinkage(param, e.target.value);
                triggerRender(); 
            }); 
        }
        if (numInput) { 
            numInput.addEventListener('input', (e) => { 
                if(slider) slider.value = e.target.value; 
                handleLinkage(param, e.target.value);
                triggerRender(); 
            }); 
        }
    });

    // 处理侧降液管与中降液管初始联动
    function handleLinkage(param, value) {
        if (param === 'downcomerRatio') {
            const centerSlider = document.getElementById('centerRatio');
            const centerNum = document.getElementById('num_centerRatio');
            if(centerSlider && !centerSlider.disabled) {
                centerSlider.value = value;
                centerNum.value = value;
            }
        }
    }

    // 中降液管灰化样式控制函数（参照分布器样式）
    function toggleCenterRatioInput() {
        const trayTypeVal = document.getElementById('trayType').value;
        const isDouble = (trayTypeVal === 'double');
        
        const centerSlider = document.getElementById('centerRatio');
        const centerNum = document.getElementById('num_centerRatio');
        const centerLabel = document.getElementById('centerRatioLabel');
        
        centerSlider.disabled = !isDouble;
        centerNum.disabled = !isDouble;
        
        if (!isDouble) {
            centerLabel.style.color = '#a0a0a0';
            centerSlider.style.opacity = '0.4';
            centerSlider.style.cursor = 'not-allowed';
            centerNum.style.backgroundColor = '#e9ecef';
            centerNum.style.color = '#a0a0a0';
            centerNum.style.cursor = 'not-allowed';
        } else {
            centerLabel.style.color = '#d9534f';
            centerSlider.style.opacity = '1';
            centerSlider.style.cursor = 'pointer';
            centerNum.style.backgroundColor = '';
            centerNum.style.color = '';
            centerNum.style.cursor = 'text';
        }
    }

    // 初始化运行一次灰化检测
    toggleCenterRatioInput();

    // 塔板选型切换事件
    document.getElementById('trayType').addEventListener('change', (e) => {
        toggleCenterRatioInput();
        triggerRender();
    });
    
    document.getElementById('gridDir').addEventListener('change', triggerRender);

    // 计算模式单选框切换
    document.querySelectorAll('input[name="calcTrigger"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
            calcTriggerMode = e.target.value;
            const btn = document.getElementById('btnCalculate');
            btn.style.display = calcTriggerMode === 'manual' ? 'block' : 'none';
        });
    });

    document.getElementById('btnCalculate').addEventListener('click', () => { render(); });

    // 序列号小眼睛显隐切换逻辑
    const toggleKeyBtn = document.getElementById('toggleKeyBtn');
    const licenseKeyInput = document.getElementById('licenseKey');

    const eyeOpenPath = 'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z';
    const eyeClosedPath = 'M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z';

    toggleKeyBtn.addEventListener('click', () => {
        if (licenseKeyInput.type === 'password') {
            licenseKeyInput.type = 'text';
            toggleKeyBtn.querySelector('path').setAttribute('d', eyeOpenPath);
        } else {
            licenseKeyInput.type = 'password';
            toggleKeyBtn.querySelector('path').setAttribute('d', eyeClosedPath);
        }
    });

    function getVals() {
        let vals = {
            licenseKey: document.getElementById('licenseKey').value.trim(),
            trayType: document.getElementById('trayType').value,
            gridDir: document.getElementById('gridDir').value
        };
        paramsMap.forEach(p => { vals[p] = parseFloat(document.getElementById('num_' + p).value) || 0; });
        return vals;
    }

    function triggerRender() {
        if (calcTriggerMode === 'manual') return; 
        if(renderTimer) clearTimeout(renderTimer);
        renderTimer = setTimeout(() => { render(); }, 600); 
    }

    function calculateRemainingDays(expireDateStr) {
        if (!expireDateStr) return "永久";
        const expireDate = new Date(expireDateStr);
        const diffDays = Math.ceil((expireDate - new Date()) / (1000 * 60 * 60 * 24));
        return diffDays > 0 ? `${diffDays}天` : "已到期";
    }

    async function render() {
        const v = getVals();
        if (!v.licenseKey) { alert("请先填写序列号！"); return; }

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(v)
            });
            const res = await response.json();

            if(!response.ok) { alert("校验失败: " + res.error); return; }
            
            document.getElementById('resTotalArea').innerText = res.stats.totalArea;
            document.getElementById('resHoleCount').innerText = res.stats.holeCount.toLocaleString();
            document.getElementById('resOpenRatio').innerText = res.stats.openRatio + " %";
            
            document.getElementById('remains').innerText = res.remainingCount;
            document.getElementById('expireDays').innerText = calculateRemainingDays(res.expire);

            drawSVG(v, res.drawData);
        } catch (error) {
            console.error("云端计算失败:", error);
            alert("网络错误或服务器异常，请检查网络设置。");
        }
    }

    function drawSVG(v, data) {
        const svg = document.getElementById('traySvg');
        const w = 760, h = 760;
        
        const scale = (w - 80) / (data.trayR * 2);
        const cx = w / 2;
        const cy = h / 2 - 15;
        
        const R = data.trayR * scale;
        const innerR = Math.max(0, data.innerR) * scale;
        const weirDist = data.weirDist * scale;
        const centerW = (data.centerW || 0) * scale;
        const calmZ = data.calmZ * scale;
        
        let content = `<defs>
            <clipPath id="trayClip">
                <circle cx="${cx}" cy="${cy}" r="${R}" />
            </clipPath>
            <clipPath id="innerClip">
                <circle cx="${cx}" cy="${cy}" r="${innerR}" />
            </clipPath>
            <mask id="blindMask">
                <rect x="0" y="0" width="${w}" height="${h}" fill="white" />
                <circle cx="${cx}" cy="${cy}" r="${innerR}" fill="black" />
            </mask>
        </defs>`;

        content += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />`;
        content += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#a7f3d0" mask="url(#blindMask)" />`;

        content += `<g clip-path="url(#trayClip)">`;
        const topY = cy - R;
        const fullHeight = R * 2;
        const sideW = Math.max(0, R - weirDist);
        content += `<rect x="${cx - R}" y="${topY}" width="${sideW}" height="${fullHeight}" fill="#fed7d7" />`;
        content += `<rect x="${cx + weirDist}" y="${topY}" width="${sideW}" height="${fullHeight}" fill="#fed7d7" />`;
        if (v.trayType === 'double') {
            content += `<rect x="${cx - centerW/2}" y="${topY}" width="${centerW}" height="${fullHeight}" fill="#fed7d7" />`;
        }
        content += `</g>`;

        content += `<g clip-path="url(#trayClip)">`;
        content += `<rect x="${cx - weirDist}" y="${topY}" width="${calmZ}" height="${fullHeight}" fill="#feebc8" />`;
        content += `<rect x="${cx + weirDist - calmZ}" y="${topY}" width="${calmZ}" height="${fullHeight}" fill="#feebc8" />`;
        if (v.trayType === 'double') {
            content += `<rect x="${cx - centerW/2 - calmZ}" y="${topY}" width="${calmZ}" height="${fullHeight}" fill="#feebc8" />`;
            content += `<rect x="${cx + centerW/2}" y="${topY}" width="${calmZ}" height="${fullHeight}" fill="#feebc8" />`;
        }
        content += `</g>`;

        content += `<g clip-path="url(#innerClip)">`;
        const calmLeft = -data.weirDist + data.calmZ;
        const calmRight = data.weirDist - data.calmZ;
        for (let i = 0; i < data.panelsY.length - 1; i++) {
            const ySeamBottom = data.panelsY[i].top * scale; 
            const seamH = v.seamWidth * scale;
            if (v.trayType === 'single') {
                if (calmRight - calmLeft > 0) {
                    content += `<rect x="${cx + calmLeft * scale}" y="${cy + ySeamBottom}" width="${(calmRight - calmLeft) * scale}" height="${seamH}" fill="#cbd5e0" />`;
                }
            } else {
                const seg1Right = -data.centerW/2 - data.calmZ;
                if (seg1Right > calmLeft) {
                    content += `<rect x="${cx + calmLeft * scale}" y="${cy + ySeamBottom}" width="${(seg1Right - calmLeft) * scale}" height="${seamH}" fill="#cbd5e0" />`;
                }
                const seg2Left = data.centerW/2 + data.calmZ;
                if (calmRight > seg2Left) {
                    content += `<rect x="${cx + seg2Left * scale}" y="${cy + ySeamBottom}" width="${(calmRight - seg2Left) * scale}" height="${seamH}" fill="#cbd5e0" />`;
                }
            }
        }
        content += `</g>`;

        const radius = Math.max(0.25, (v.holeDiameter * scale) / 2);
        let holesHtml = "";
        data.holes.forEach(hole => {
        holesHtml += `<circle cx="${cx + (hole.x * scale)}" cy="${cy + (hole.y * scale)}" r="${radius}" fill="#000000" />`;
        });
        content += holesHtml;

        const strokeColor = "#e53e3e";
        const annotY = cy + R + 25; 
        content += `<g stroke="${strokeColor}" stroke-width="1.5">`;
        content += `<line x1="${cx - R}" y1="${cy}" x2="${cx - R}" y2="${annotY + 10}" stroke-dasharray="4,4" opacity="0.6"/>`;
        content += `<line x1="${cx + R}" y1="${cy}" x2="${cx + R}" y2="${annotY + 10}" stroke-dasharray="4,4" opacity="0.6"/>`;
        content += `<line x1="${cx - R}" y1="${annotY}" x2="${cx + R}" y2="${annotY}" />`;
        content += `<line x1="${cx - R}" y1="${annotY - 6}" x2="${cx - R}" y2="${annotY + 6}" />`;
        content += `<line x1="${cx + R}" y1="${annotY - 6}" x2="${cx + R}" y2="${annotY + 6}" />`;
        content += `</g>`;
        
        const textD = `Φ${Math.round(v.trayDiameter)}`;
        content += `<rect x="${cx - 30}" y="${annotY - 10}" width="60" height="20" fill="rgba(255,255,255,0.85)" rx="3" />`;
        content += `<text x="${cx}" y="${annotY}" fill="${strokeColor}" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">${textD}</text>`;

        const bowHeight = Math.round(data.trayR - data.weirDist);
        if (bowHeight > 0) {
            const bx1 = cx + weirDist;
            const bx2 = cx + R;
            content += `<g stroke="${strokeColor}" stroke-width="1.5">
                <line x1="${bx1}" y1="${cy}" x2="${bx2}" y2="${cy}" />
                <line x1="${bx1}" y1="${cy - 6}" x2="${bx1}" y2="${cy + 6}" />
                <line x1="${bx2}" y1="${cy - 6}" x2="${bx2}" y2="${cy + 6}" />
            </g>`;
            const midX = (bx1 + bx2) / 2;
            const textH = `${bowHeight}`;
            content += `<rect x="${midX - 15}" y="${cy - 10}" width="30" height="20" fill="rgba(255,255,255,0.85)" rx="3" />`;
            content += `<text x="${midX}" y="${cy}" fill="${strokeColor}" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">${textH}</text>`;
        }
        
        if (v.trayType === 'double' && data.centerW > 0) {
            const dimY = cy + R * 0.45;
            const cwLeft = cx - centerW / 2;
            const cwRight = cx + centerW / 2;
            content += `<g stroke="${strokeColor}" stroke-width="1.5">
                <line x1="${cwLeft}" y1="${dimY}" x2="${cwRight}" y2="${dimY}" />
                <line x1="${cwLeft}" y1="${dimY - 6}" x2="${cwLeft}" y2="${dimY + 6}" />
                <line x1="${cwRight}" y1="${dimY - 6}" x2="${cwRight}" y2="${dimY + 6}" />
            </g>`;
            const textCW = `${Math.round(data.centerW)}`;
            content += `<rect x="${cx - 20}" y="${dimY - 10}" width="40" height="20" fill="rgba(255,255,255,0.85)" rx="3" />`;
            content += `<text x="${cx}" y="${dimY}" fill="${strokeColor}" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">${textCW}</text>`;
        }

        svg.innerHTML = content;
    }
</script>
