<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化工计算工具集</title>
    <style>
        body { 
            font-family: 'Microsoft YaHei', sans-serif; 
            background-color: #f4f6f8; 
            margin: 0; 
            padding: 0; 
            color: #333; 
        }

        /* 顶部导航栏布局 */
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e9ecef;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between; /* 两端对齐：品牌居左，水印居右 */
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            position: relative;
            overflow: hidden;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1;
        }

        /* 左上角 Logo 样式 */
        .logo {
            height: 48px;
            width: auto;
            border-radius: 6px;
            object-fit: contain;
        }

        .brand-text h1 {
            font-size: 20px;
            color: #2c3e50;
            margin: 0;
            line-height: 1.2;
            letter-spacing: 0.5px;
        }

        /* 浅色水印样式 */
        .watermark {
            font-size: 18px;
            font-weight: 600;
            color: #ced4da; /* 浅灰色 */
            opacity: 0.6;   /* 半透明 */
            letter-spacing: 1px;
            user-select: none; /* 防选中 */
            font-family: Arial, sans-serif;
            z-index: 1;
        }

        /* 主体容器 */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .grid { 
            display: grid; 
            /* 自动响应式排版：屏幕宽时并排，屏幕窄时变成单列 */
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 25px; 
        }
        
        .card { 
            background: #fff; 
            border-radius: 12px; 
            padding: 25px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            text-decoration: none; /* 去除链接下划线 */
            color: inherit; 
            transition: all 0.3s ease; 
            border: 1px solid #e9ecef; 
            display: block; 
            position: relative;
            overflow: hidden;
        }
        
        /* 鼠标悬浮时的卡片动效 */
        .card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 12px 25px rgba(13, 110, 253, 0.12); 
            border-color: #0d6efd; 
        }
        
        /* 卡片顶部蓝条 */
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #0d6efd;
            transform: scaleX(0);
            transition: transform 0.3s ease;
            transform-origin: left;
        }
        .card:hover::before {
            transform: scaleX(1);
        }

        .card h3 { margin-top: 0; color: #0d6efd; font-size: 18px; margin-bottom: 10px; }
        .card p { color: #6c757d; font-size: 14px; margin: 0; line-height: 1.6; }
    </style>
</head>
<body>

    <!-- 顶部导航栏（含左侧 Logo/标题 & 右侧浅色水印） -->
    <div class="navbar">
        <div class="brand-container">
            <img src="./logo.png" alt="WCAD Logo" class="logo">
            <div class="brand-text">
                <h1>化工计算工具集</h1>
            </div>
        </div>
        <div class="watermark">www.wcad.wang</div>
    </div>

    <!-- 计算工具列表 -->
    <div class="container">
        <div class="grid">
            <!-- 第1个工具：槽盘分布器 -->
            <a href="./fenbuqi.html" class="card">
                <h3>槽盘分布器布孔计算</h3>
                <p>适用于最多3根梁</p>
            </a>

            <!-- 第2个工具：筛板布孔 -->
            <a href="./shaiban.html" class="card">
                <h3>筛板布孔计算</h3>
                <p>适用于单溢流、单溢流带1根梁、双溢流</p>
            </a>
        </div>
    </div>

</body>
</html>
